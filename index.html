<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oral Exam Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1a;
    --bg2: #222222;
    --bg3: #2a2a2a;
    --border: #333333;
    --border2: #444444;
    --accent: #c8c8c8;
    --accent2: #999999;
    --text: #ebebeb;
    --text2: #999999;
    --text3: #606060;
    --green: #5dba7e;
    --green-bg: #1a2b20;
    --amber: #d4a843;
    --amber-bg: #2a2010;
    --red: #c96060;
    --red-bg: #2a1818;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .page {
    max-width: 1280px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 1rem;
  }

  .setup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
  }

  .field input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  .field input:focus { border-color: var(--accent); }

  .student-row {
    display: grid;
    grid-template-columns: 1fr 90px 36px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }

  .student-row input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 7px 11px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }

  .student-row input:focus { border-color: var(--accent); }

  .student-row input[type="number"] {
    font-family: 'DM Mono', monospace;
    -moz-appearance: textfield;
  }
  .student-row input::-webkit-outer-spin-button,
  .student-row input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .btn-remove {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text3);
    cursor: pointer;
    font-size: 16px;
    height: 34px;
    width: 34px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-remove:hover { border-color: var(--red); color: var(--red); }

  .btn-add {
    background: transparent;
    border: 1px dashed var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text2);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    margin-top: 4px;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-add:hover { border-color: var(--accent); color: var(--accent); }

  .btn-primary {
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: #111111;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 24px;
    margin-top: 1.25rem;
    width: 100%;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }
  .btn-primary:hover { background: #e0e0e0; }
  .btn-primary:active { transform: scale(0.99); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-ghost:hover { border-color: var(--border2); color: var(--text); }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 1.25rem;
  }

  .metric {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
  }

  .metric-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 6px;
  }

  .metric-value {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }

  .metric-value.ok { color: var(--green); }
  .metric-value.warn { color: var(--amber); }
  .metric-value.bad { color: var(--red); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    text-align: left;
    padding: 0 10px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  tbody td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  .mono { font-family: 'DM Mono', monospace; }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    gap: 5px;
  }

  .badge::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    display: inline-block;
  }

  .badge-waiting {
    background: rgba(255,255,255,0.05);
    color: var(--text3);
  }
  .badge-waiting::before { background: var(--text3); }

  .badge-ongoing {
    background: var(--amber-bg);
    color: var(--amber);
    animation: pulse 2s ease-in-out infinite;
  }
  .badge-ongoing::before { background: var(--amber); }

  .badge-done {
    background: var(--green-bg);
    color: var(--green);
  }
  .badge-done::before { background: var(--green); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  .delay-tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 6px;
  }
  .delay-ok { background: var(--green-bg); color: var(--green); }
  .delay-warn { background: var(--amber-bg); color: var(--amber); }
  .delay-bad { background: var(--red-bg); color: var(--red); }

  .action-wrap { display: flex; gap: 6px; align-items: center; }

  .btn-action {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-action.start:hover { border-color: var(--accent); color: var(--accent); }
  .btn-action.end:hover { border-color: var(--green); color: var(--green); }
  .btn-action.reset:hover { border-color: var(--red); color: var(--red); }
  .btn-action.edit {
    padding: 3px 7px;
    font-size: 11px;
    color: var(--text3);
    border-color: transparent;
  }
  .btn-action.edit:hover { border-color: var(--border); color: var(--text2); }

  .session-footer {
    margin-top: 1rem;
    padding: 1rem 1.25rem;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .session-footer-item .sf-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    margin-bottom: 4px;
  }

  .session-footer-item .sf-value {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
  }

  .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .row-num {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text3);
    width: 20px;
  }

  .empty-hint {
    font-size: 13px;
    color: var(--text3);
    padding: 4px 0 8px;
  }


  .upload-zone {
    border: 1px dashed var(--border2);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text2);
    font-size: 13px;
  }
  .upload-zone:hover { border-color: var(--accent); color: var(--text); background: rgba(255,255,255,0.02); }
  .upload-zone input[type="file"] { display: none; }
  .upload-zone .upload-icon { font-size: 18px; flex-shrink: 0; }
  .upload-hint { font-size: 11px; color: var(--text3); margin-bottom: 10px; }

  @media (max-width: 680px) {
    .setup-grid { grid-template-columns: 1fr 1fr; }
    .summary-bar { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 480px) {
    .setup-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>Oral Exam Tracker</h1>
    <p>Configure your session, then track actual times during the exam.</p>
  </header>

  <!-- SETUP PANEL -->
  <div id="setup-panel">
    <div class="card">
      <div class="section-label">Session timing</div>
      <div class="setup-grid">
        <div class="field">
          <label for="session-start">Session start</label>
          <input type="time" id="session-start" value="10:00">
        </div>
        <div class="field">
          <label for="session-end">Planned end</label>
          <input type="time" id="session-end" value="12:30">
        </div>
        <div class="field">
          <label for="default-dur">Default slot (min)</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="number" id="default-dur" value="15" min="1" max="300" style="flex:1;">
            <button class="btn-ghost" onclick="applyDefaultToAll()" title="Apply this duration to all students" style="white-space:nowrap;padding:7px 12px;font-size:12px;">Apply to all</button>
          </div>
        </div>
        <div class="field">
          <label for="default-gap">Gap between slots (min)</label>
          <input type="number" id="default-gap" value="0" min="0" max="60" placeholder="0" title="Time reserved between students (e.g. to discuss grade)">
        </div>
      </div>

      <div class="section-label">Students / groups</div>
      <label class="upload-zone" id="upload-zone">
        <input type="file" id="file-upload" accept=".txt,.csv">
        <span class="upload-icon">&#8613;</span>
        <div>
          <div>Upload a file to import students</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px;">One name per line &nbsp;·&nbsp; or &nbsp;<code style="font-size:11px;">Name, minutes</code>&nbsp; per line &nbsp;·&nbsp; .txt or .csv</div>
        </div>
      </label>
      <div id="student-header" style="display:grid;grid-template-columns:1fr 90px 36px;gap:8px;margin-bottom:6px;">
        <span style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding-left:2px;">Name</span>
        <span style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Min</span>
        <span></span>
      </div>
      <div id="student-list"></div>
      <button class="btn-add" onclick="addStudent()">+ Add student or group</button>

      <button class="btn-primary" onclick="buildTracker()">Generate schedule →</button>
    </div>
  </div>

  <!-- TRACKER PANEL -->
  <div id="tracker-panel" style="display:none;">
    <div class="top-bar">
      <span style="font-size:13px;color:var(--text2);" id="session-title">Exam session</span>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" onclick="backToSetup()">← Edit setup</button>
        <button class="btn-ghost" onclick="if(confirm('Clear session and start over?')){clearState();location.reload();}" style="color:var(--red);border-color:var(--red-bg);">✕ Clear session</button>
      </div>
    </div>

    <div class="summary-bar" id="summary-bar"></div>

    <div class="card" style="padding:1.25rem;">
      <div style="overflow-x:auto;">
        <table id="tracker-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Student / Group</th>
              <th>Planned start</th>
              <th>Planned end</th>
              <th>Actual start</th>
              <th>Actual end</th>
              <th>Status</th>
              <th>Duration</th>
              <th>Time</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tracker-body"></tbody>
        </table>
      </div>
      <div id="session-footer"></div>
    </div>
  </div>
</div>

<script>
let students = [];
let sessionData = [];
let sessionStart = 0;
let sessionEnd = 0;

function toMin(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

function fmt(m) {
  return String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0');
}

function fmtDelay(d) {
  if (d === 0) return '';
  return (d > 0 ? '+' : '') + d + ' min';
}

function delayClass(d) {
  if (d <= 0) return 'delay-ok';
  if (d <= 10) return 'delay-warn';
  return 'delay-bad';
}

function addStudent(name='', dur=null) {
  const defaultDur = parseInt(document.getElementById('default-dur').value) || 15;
  students.push({ id: Date.now() + Math.random(), name, duration: dur || defaultDur });
  renderStudents();
}

function removeStudent(id) {
  students = students.filter(s => s.id !== id);
  renderStudents();
}

function renderStudents() {
  const list = document.getElementById('student-list');
  if (!students.length) {
    list.innerHTML = '<p class="empty-hint">No students yet.</p>';
    return;
  }
  list.innerHTML = students.map((s, i) => `
    <div class="student-row">
      <input type="text" value="${s.name}" placeholder="e.g. Group A or Mrs. Anne"
        oninput="students[${i}].name = this.value">
      <input type="number" value="${s.duration}" min="1" max="300"
        oninput="students[${i}].duration = parseInt(this.value) || 15">
      <button class="btn-remove" onclick="removeStudent(${s.id})">×</button>
    </div>
  `).join('');
}

// ── File import ───────────────────────────────────────────
document.getElementById('file-upload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const lines = ev.target.result.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const defaultDur = parseInt(document.getElementById('default-dur').value) || 15;
    const imported = [];
    for (const line of lines) {
      // support: "Name" or "Name, 20" or "Name; 20" or "Name\t20"
      const parts = line.split(/[,;\t]/).map(p => p.trim());
      const name = parts[0];
      const dur  = parts[1] && !isNaN(parseInt(parts[1])) ? parseInt(parts[1]) : defaultDur;
      if (name) imported.push({ id: Date.now() + Math.random(), name, duration: dur });
    }
    if (imported.length === 0) { alert('No valid entries found in the file.'); return; }
    if (students.length > 0 && !confirm(`Replace the current ${students.length} student(s) with ${imported.length} imported?`)) return;
    students = imported;
    renderStudents();
    // update upload zone label
    document.getElementById('upload-zone').querySelector('div div:first-child').textContent =
      `✓ Imported ${imported.length} student(s) from "${file.name}"`;
  };
  reader.readAsText(file);
  // reset so re-uploading same file triggers change
  this.value = '';
});

function applyDefaultToAll() {
  const dur = parseInt(document.getElementById('default-dur').value) || 15;
  if (!students.length) { alert('No students to update.'); return; }
  students.forEach(s => s.duration = dur);
  renderStudents();
}

function buildTracker() {
  const ss = document.getElementById('session-start').value;
  const se = document.getElementById('session-end').value;
  if (!ss || !se) { alert('Please set session start and end times.'); return; }
  if (!students.length) { alert('Add at least one student or group.'); return; }
  if (students.some(s => !s.name.trim())) { alert('Give every student a name.'); return; }

  sessionStart = toMin(ss);
  sessionEnd   = toMin(se);

  if (sessionEnd <= sessionStart) { alert('Planned end must be after session start.'); return; }

  const available = sessionEnd - sessionStart;
  const gap = parseInt(document.getElementById('default-gap').value) || 0;
  const totalSlots = students.reduce((sum, s) => sum + (s.duration || 15), 0) + gap * (students.length - 1);
  if (totalSlots > available) {
    const over = totalSlots - available;
    const proceed = confirm(
      `⚠️ Slots exceed available time!\n\n` +
      `Total slots + gaps: ${totalSlots} min\n` +
      `Available:          ${available} min\n` +
      `Overflow:           +${over} min\n\n` +
      `The last student(s) will run past the planned end time.\n` +
      `Proceed anyway?`
    );
    if (!proceed) return;
  }

  let cursor = sessionStart;
  sessionData = students.map((s, i) => {
    const dur = s.duration || 15;
    const ps  = cursor;
    const pe  = cursor + dur;
    cursor    = pe + gap;
    return { ...s, index: i, planned_start: ps, planned_end: pe,
             actual_start: null, actual_end: null, status: 'waiting' };
  });

  const defaultDur = students.length > 0 ? (students[0].duration || 15) : 15;
  const gapLabel = gap > 0 ? ` · ${gap} min gap` : '';
  document.getElementById('session-title').textContent =
    `Session ${fmt(sessionStart)} → ${fmt(sessionEnd)} · ${defaultDur} min per slot${gapLabel}`;
  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('tracker-panel').style.display = 'block';
  render();
}

function backToSetup() {
  document.getElementById('setup-panel').style.display = 'block';
  document.getElementById('tracker-panel').style.display = 'none';
  saveState();
}

function startStudent(i) {
  const now = new Date();
  const m = now.getHours() * 60 + now.getMinutes();
  sessionData[i].actual_start = m;
  sessionData[i].status = 'ongoing';
  render();
}

function endStudent(i) {
  const now = new Date();
  const m = now.getHours() * 60 + now.getMinutes();
  sessionData[i].actual_end = m;
  sessionData[i].status = 'done';
  render();
}

function resetStudent(i) {
  sessionData[i].actual_start = null;
  sessionData[i].actual_end = null;
  sessionData[i].status = 'waiting';
  render();
}

function editTime(i, field) {
  const current = sessionData[i][field];
  const hint = current !== null ? fmt(current) : '';
  const val = prompt('Enter time (HH:MM)' + (hint ? ' [current: ' + hint + ']' : '') + ':', hint || '');
  if (val === null) return;
  const m = val.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) { alert('Invalid format. Use HH:MM'); return; }
  sessionData[i][field] = parseInt(m[1]) * 60 + parseInt(m[2]);
  if (field === 'actual_start' && sessionData[i].actual_end === null)
    sessionData[i].status = 'ongoing';
  if (field === 'actual_end') sessionData[i].status = 'done';
  render();
}

let _ticker = null;

function nowMin() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}

function computeDelay() {
  const ongoingStudent = sessionData.find(s => s.status === 'ongoing');
  const lastDone = [...sessionData].reverse().find(s => s.status === 'done');

  if (ongoingStudent) {
    // Live: how far past this student's planned end are we right now?
    // Add any delay already accumulated from previous students.
    const prevDelay = lastDone && lastDone.actual_end !== null
      ? lastDone.actual_end - lastDone.planned_end
      : 0;
    const liveOverrun = Math.max(0, nowMin() - ongoingStudent.planned_end);
    return prevDelay + liveOverrun;
  } else if (lastDone && lastDone.actual_end !== null) {
    // No one ongoing: delay = how much the last finished student shifted vs their planned end.
    return lastDone.actual_end - lastDone.planned_end;
  }
  return 0;
}

function renderSummaryBar() {
  const done    = sessionData.filter(s => s.status === 'done').length;
  const ongoing = sessionData.filter(s => s.status === 'ongoing').length;
  const total   = sessionData.length;
  const currentDelay = computeDelay();
  const sb = document.getElementById('summary-bar');
  if (!sb) return;
  const delC = currentDelay > 10 ? 'bad' : currentDelay > 0 ? 'warn' : 'ok';
  sb.innerHTML = `
    <div class="metric">
      <div class="metric-label">Progress</div>
      <div class="metric-value">${done}/${total}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Ongoing</div>
      <div class="metric-value ${ongoing ? 'warn' : ''}">${ongoing || '—'}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Running delay</div>
      <div class="metric-value ${delC}">${currentDelay <= 0 ? 'On time' : fmtDelay(currentDelay)}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Planned end</div>
      <div class="metric-value">${fmt(sessionEnd)}</div>
    </div>
  `;
}

function startTicker() {
  if (_ticker) return;
  _ticker = setInterval(() => { renderSummaryBar(); renderRowTimers(); }, 10000);
}

function stopTicker() {
  if (_ticker) { clearInterval(_ticker); _ticker = null; }
}

function buildTimeCell(s) {
  // Use actual start + slot duration as the real expected end
  const dur = s.planned_end - s.planned_start;
  const realEnd = s.actual_start + dur;
  const remaining = realEnd - nowMin();
  if (remaining > 0) {
    return `<span class="mono delay-tag delay-ok">${remaining} min left</span>`;
  } else if (remaining === 0) {
    return `<span class="mono delay-tag delay-warn">time up</span>`;
  } else {
    return `<span class="mono delay-tag delay-bad">+${-remaining} min over</span>`;
  }
}

function renderRowTimers() {
  sessionData.forEach((s, i) => {
    const cell = document.getElementById('timer-cell-' + i);
    if (!cell) return;
    if (s.status === 'ongoing') {
      cell.innerHTML = buildTimeCell(s);
    }
  });
}

function render() {
  const done    = sessionData.filter(s => s.status === 'done').length;
  const ongoing = sessionData.filter(s => s.status === 'ongoing').length;
  const total   = sessionData.length;

  renderSummaryBar();
  if (ongoing > 0) startTicker(); else stopTicker();

  // table
  const body = document.getElementById('tracker-body');
  body.innerHTML = sessionData.map((s, i) => {
    const badge = {
      waiting: '<span class="badge badge-waiting">Waiting</span>',
      ongoing: '<span class="badge badge-ongoing">Ongoing</span>',
      done:    '<span class="badge badge-done">Done</span>'
    }[s.status];

    const sdiff = s.actual_start !== null ? s.actual_start - s.planned_start : null;
    const ediff = s.actual_end   !== null ? s.actual_end   - s.planned_end   : null;

    const asCell = s.actual_start !== null
      ? `<span class="mono">${fmt(s.actual_start)}</span>${sdiff !== 0 && sdiff !== null ? `<span class="delay-tag ${delayClass(sdiff)}">${fmtDelay(sdiff)}</span>` : ''}
         <button class="btn-action edit" onclick="editTime(${i},'actual_start')" title="Edit">✎</button>`
      : `<span style="color:var(--text3)">—</span><button class="btn-action edit" onclick="editTime(${i},'actual_start')" title="Set">✎</button>`;

    const aeCell = s.actual_end !== null
      ? `<span class="mono">${fmt(s.actual_end)}</span>${ediff !== 0 && ediff !== null ? `<span class="delay-tag ${delayClass(ediff)}">${fmtDelay(ediff)}</span>` : ''}
         <button class="btn-action edit" onclick="editTime(${i},'actual_end')" title="Edit">✎</button>`
      : `<span style="color:var(--text3)">—</span><button class="btn-action edit" onclick="editTime(${i},'actual_end')" title="Set">✎</button>`;

    const action = s.status === 'waiting'
      ? `<button class="btn-action start" onclick="startStudent(${i})">Start</button>`
      : s.status === 'ongoing'
      ? `<button class="btn-action end" onclick="endStudent(${i})">End</button>`
      : `<button class="btn-action reset" onclick="resetStudent(${i})">Reset</button>`;

    const slotDur = s.planned_end - s.planned_start;
    const actualDur = s.actual_start !== null && s.actual_end !== null
      ? s.actual_end - s.actual_start
      : null;
    const durCell = actualDur !== null
      ? (() => {
          const diff = actualDur - slotDur;
          const tag = diff === 0 ? '' : diff > 0
            ? `<span class="delay-tag delay-bad">+${diff} min</span>`
            : `<span class="delay-tag delay-ok">${diff} min</span>`;
          return `<span class="mono">${actualDur} min</span> ${tag}`;
        })()
      : `<span style="color:var(--text3)">—</span>`;

    const timeCell = s.status === 'ongoing'
      ? buildTimeCell(s)
      : `<span style="color:var(--text3)">—</span>`;

    return `<tr>
      <td><span class="row-num">${i + 1}</span></td>
      <td style="font-weight:500;">${s.name || '—'}</td>
      <td><span class="mono">${fmt(s.planned_start)}</span></td>
      <td><span class="mono">${fmt(s.planned_end)}</span></td>
      <td>${asCell}</td>
      <td>${aeCell}</td>
      <td>${badge}</td>
      <td>${durCell}</td>
      <td id="timer-cell-${i}">${timeCell}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');

  // session footer
  const footer = document.getElementById('session-footer');
  const allDone = done === total;
  const lastDone = [...sessionData].reverse().find(s => s.status === 'done');
  const lastActualEnd = lastDone && lastDone.actual_end !== null ? lastDone.actual_end : null;

  if (allDone && lastActualEnd !== null) {
    const totalDelay = lastActualEnd - sessionEnd;
    const dc = totalDelay > 10 ? 'delay-bad' : totalDelay > 0 ? 'delay-warn' : 'delay-ok';
    footer.innerHTML = `
      <div class="session-footer" style="margin-top:1rem;">
        <div class="session-footer-item">
          <div class="sf-label">Session finished</div>
          <div class="sf-value">${fmt(lastActualEnd)}</div>
        </div>
        <div class="session-footer-item">
          <div class="sf-label">Planned end</div>
          <div class="sf-value">${fmt(sessionEnd)}</div>
        </div>
        <div class="session-footer-item">
          <div class="sf-label">Total delay</div>
          <div class="sf-value"><span class="delay-tag ${dc}" style="font-size:16px;">${totalDelay === 0 ? 'On time ✓' : fmtDelay(totalDelay)}</span></div>
        </div>
      </div>`;
  } else if (lastActualEnd !== null) {
    // estimate remaining
    const remaining = sessionData.slice(done + (ongoing > 0 ? 1 : 0))
      .reduce((a, s) => a + (s.planned_end - s.planned_start), 0);
    const estEnd = lastActualEnd + remaining;
    const estDelay = estEnd - sessionEnd;
    const dc = estDelay > 10 ? 'delay-bad' : estDelay > 0 ? 'delay-warn' : 'delay-ok';
    footer.innerHTML = `
      <div class="session-footer" style="margin-top:1rem;">
        <div class="session-footer-item">
          <div class="sf-label">Estimated finish</div>
          <div class="sf-value">${fmt(estEnd)}</div>
        </div>
        <div class="session-footer-item">
          <div class="sf-label">Planned end</div>
          <div class="sf-value">${fmt(sessionEnd)}</div>
        </div>
        <div class="session-footer-item">
          <div class="sf-label">Estimated delay</div>
          <div class="sf-value"><span class="delay-tag ${dc}" style="font-size:16px;">${estDelay === 0 ? 'On time' : fmtDelay(estDelay)}</span></div>
        </div>
      </div>`;
  } else {
    footer.innerHTML = '';
  }

  saveState();
}

// ── Persistence ──────────────────────────────────────────
const STORE_KEY = 'oral-exam-tracker-v1';

function saveState() {
  const state = {
    setup: {
      session_start: document.getElementById('session-start').value,
      session_end:   document.getElementById('session-end').value,
      default_dur:   document.getElementById('default-dur').value,
      students,
    },
    tracker: {
      active: document.getElementById('tracker-panel').style.display !== 'none',
      sessionStart,
      sessionEnd,
      sessionData,
    }
  };
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function clearState() {
  localStorage.removeItem(STORE_KEY);
}

function restoreState() {
  let raw;
  try { raw = localStorage.getItem(STORE_KEY); } catch(e) {}
  if (!raw) return false;
  let state;
  try { state = JSON.parse(raw); } catch(e) { return false; }

  const s = state.setup;
  document.getElementById('session-start').value = s.session_start || '10:00';
  document.getElementById('session-end').value   = s.session_end   || '12:30';
  document.getElementById('default-dur').value   = s.default_dur   || 15;
  students = s.students || [];
  renderStudents();

  const t = state.tracker;
  if (t && t.active && t.sessionData && t.sessionData.length) {
    sessionStart = t.sessionStart;
    sessionEnd   = t.sessionEnd;
    sessionData  = t.sessionData;
    const defaultDur = students.length > 0 ? (students[0].duration || 15) : 15;
    document.getElementById('session-title').textContent =
      `Session ${fmt(sessionStart)} → ${fmt(sessionEnd)} · ${defaultDur} min per slot`;
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('tracker-panel').style.display = 'block';
    render();
  }
  return true;
}

// ── Boot ──────────────────────────────────────────────────
const restored = restoreState();
if (!restored) {
  addStudent('Group A', 15);
  addStudent('Group B', 15);
  renderStudents();
}
</script>
</body>
